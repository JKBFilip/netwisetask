name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore CatFactSolution.sln

    - name: Build solution
      run: dotnet build CatFactSolution.sln -c Release --no-restore

    - name: Run xUnit Tests
      run: dotnet test CatFactSolution.sln -c Release --no-build --verbosity normal

  docker-verify:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t catfact-worker:test .